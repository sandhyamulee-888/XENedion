<svg width="1440" height="980" viewBox="0 0 1440 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Light Enterprise Canvas Linear Gradient -->
    <linearGradient id="entBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FCFDFF"/>
      <stop offset="70%" stop-color="#F4F7FC"/>
      <stop offset="100%" stop-color="#E9F0F8"/>
    </linearGradient>

    <!-- Deep Corporate Navy Ambient Core Glow -->
    <radialGradient id="hubNavyGlow" cx="70%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0A1931" stop-opacity="0.07"/>
      <stop offset="50%" stop-color="#133E87" stop-opacity="0.03"/>
      <stop offset="90%" stop-color="#0A1931" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Orange Brand Accent Glow -->
    <radialGradient id="accentOrangeGlow" cx="28%" cy="26%" r="48%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.08"/>
      <stop offset="45%" stop-color="#FFA043" stop-opacity="0.025"/>
      <stop offset="85%" stop-color="#FF7A00" stop-opacity="0"/>
    </radialGradient>

    <!-- Center Stage Light Beam -->
    <radialGradient id="centerStageGlow" cx="62%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#F8FAFC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F1F5F9" stop-opacity="0"/>
    </radialGradient>

    <!-- Engineering Precision Grid -->
    <pattern id="precisionGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#E2E8F0" stroke-width="0.7" stroke-opacity="0.6"/>
      <circle cx="48" cy="48" r="1.2" fill="#CBD5E1" fill-opacity="0.6"/>
    </pattern>

    <!-- Fiber Optic Connection Gradient -->
    <linearGradient id="fiberLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.3"/>
      <stop offset="25%" stop-color="#FF7A00" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#133E87" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Soft Blend to Bottom Content -->
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1440" height="980" fill="url(#entBg)"/>

  <!-- Enterprise Ambient Glows -->
  <rect width="1440" height="980" fill="url(#hubNavyGlow)"/>
  <rect width="1440" height="980" fill="url(#accentOrangeGlow)"/>
  <rect width="1440" height="980" fill="url(#centerStageGlow)"/>

  <!-- High-Precision Architectural Grid -->
  <rect width="1440" height="980" fill="url(#precisionGrid)"/>

  <!-- Architectural 3D Ground Depth Planes & Floor Guides -->
  <g opacity="0.5">
    <line x1="0" y1="900" x2="1440" y2="900" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="0" y1="940" x2="1440" y2="940" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="140" y1="980" x2="480" y2="780" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="720" y1="980" x2="720" y2="780" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="1300" y1="980" x2="960" y2="780" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Multi-Branch Synchronized Network Topology (Realistic Central Cloud Architecture) -->
  <g opacity="0.65">
    <!-- Orbital Synchronization Trunk Line (Inspired by XENedion Orbital Ring) -->
    <path d="M 80 340 C 340 180, 820 160, 1280 260 C 1420 300, 1120 460, 720 420" fill="none" stroke="url(#fiberLineGrad)" stroke-width="1.8" stroke-dasharray="6 6"/>
    <path d="M 140 640 C 420 520, 840 680, 1220 540 C 1360 480, 1420 520, 1440 500" fill="none" stroke="url(#fiberLineGrad)" stroke-width="1.2" stroke-dasharray="4 6"/>

    <!-- Central Cloud Hub & Regional Store Branches Connections -->
    <path d="M 880 240 L 720 560" fill="none" stroke="#FF7A00" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="3 4"/>
    <path d="M 520 280 L 880 240" fill="none" stroke="#133E87" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="3 4"/>
    <path d="M 1160 520 L 980 320" fill="none" stroke="#64748B" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4"/>
    <path d="M 320 460 L 520 280" fill="none" stroke="#FF7A00" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="3 4"/>

    <!-- Branch Nodes with Subtle Coordinates -->
    <!-- Central Cloud Hub Node (Hyderabad HQ) -->
    <g transform="translate(880, 240)">
      <circle r="5" fill="#FF7A00"/>
      <circle r="14" stroke="#FF7A00" stroke-width="1.2" stroke-opacity="0.35"/>
      <circle r="24" stroke="#FF7A00" stroke-width="0.8" stroke-opacity="0.15"/>
    </g>

    <!-- Branch Node #01: Connaught Place (Delhi) -->
    <g transform="translate(520, 280)">
      <circle r="4" fill="#0A1931"/>
      <circle r="11" stroke="#0A1931" stroke-width="1" stroke-opacity="0.25"/>
    </g>

    <!-- Branch Node #02: Indiranagar (Bengaluru) -->
    <g transform="translate(1160, 520)">
      <circle r="4" fill="#FF7A00"/>
      <circle r="11" stroke="#FF7A00" stroke-width="1" stroke-opacity="0.3"/>
    </g>

    <!-- Branch Node #03: Bandra West (Mumbai) -->
    <g transform="translate(320, 460)">
      <circle r="3.5" fill="#0A1931"/>
      <circle r="9" stroke="#0A1931" stroke-width="1" stroke-opacity="0.2"/>
    </g>

    <!-- Central Depot Logistics Warehouse -->
    <g transform="translate(720, 560)">
      <circle r="4.5" fill="#133E87"/>
      <circle r="12" stroke="#133E87" stroke-width="1" stroke-opacity="0.3"/>
    </g>
  </g>

  <!-- Clean Transition to Page Body -->
  <rect y="840" width="1440" height="140" fill="url(#bottomFade)"/>
</svg>
