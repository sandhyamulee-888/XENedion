<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="45%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#B26E0B"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#A9B8C9"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Polished X Mark matching the brand logo -->
  <!-- Left Chrome Crescent -->
  <path d="M12 48 C 22 36, 28 26, 44 14 C 36 28, 26 40, 12 48 Z" fill="url(#chromeGrad)" filter="url(#glow)"/>
  <!-- Right Gold Crescent with Flare -->
  <path d="M18 16 C 30 26, 38 38, 52 48 C 42 34, 32 24, 18 16 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <!-- Sparkle at Gold Tip -->
  <circle cx="52" cy="14" r="2.5" fill="#FFE57F"/>
</svg>
